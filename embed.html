<!-- Crowders Camps calendar embed. Points at the GitHub Pages copy of natecrowders/crowders-calendar.
     Optional settings go after the ? :
     camp=ridge|smcc|springs (comma list), view=cal|list, details=meal,act,arr,prog,space,lodge,rent,pkg -->
<iframe id="crowders-calendar" src="https://natecrowders.github.io/crowders-calendar/?view=cal" title="Crowders Camps calendar"
        style="width:100%;max-width:1200px;height:1400px;border:0;display:block;margin:0 auto" loading="lazy"></iframe>
<script>
  // The calendar reports its height so the frame grows and shrinks with it (no inner scrollbar).
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "crowders-calendar-height")
      document.getElementById("crowders-calendar").style.height = e.data.height + "px";
  });
</script>
